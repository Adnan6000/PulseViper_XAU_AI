name: PulseViper V1 Offline CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-health:
    name: Offline V1 + Research Health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install offline test dependencies
        run: |
          python -m pip install \
            numpy \
            pandas \
            PyYAML \
            pytest

      - name: Compile AI Python
        run: |
          python -m compileall -q 02_AI

      - name: Compile testing Python
        run: |
          python -m compileall -q 04_Testing

      - name: Run offline V1 and research tests
        run: |
          python -m pytest \
            04_Testing/test_v1_health.py \
            04_Testing/test_market_regime.py \
            04_Testing/test_paper_ledger.py \
            04_Testing/test_market_context_liquidity.py \
            04_Testing/test_liquidity_lifecycle.py \
            04_Testing/test_liquidity_structure_intelligence.py \
            04_Testing/test_candle_swing_intelligence.py \
            04_Testing/test_market_decision_clarity.py \
            04_Testing/test_level_entry_intelligence.py \
            -q